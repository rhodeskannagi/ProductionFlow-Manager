name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  demo-tests:
    name: Browser domain and integrity tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run check
      - run: node scripts/build-standalone.mjs
      - run: git diff --exit-code -- ProductionFlow-Demo.html
  dotnet-build:
    name: .NET 10 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore src/ProductionFlow.Api/ProductionFlow.Api.csproj
      - run: dotnet build src/ProductionFlow.Api/ProductionFlow.Api.csproj --configuration Release --no-restore
