name: Windows desktop
on:
  push:
    branches: [main, 'feature/desktop-*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Core behavior checks
        run: dotnet run --project tests/ProductionFlow.Core.Tests -c Release
      - name: Build Windows application
        run: dotnet publish src/ProductionFlow.Desktop/ProductionFlow.Desktop.csproj -c Release -r win-x64 --self-contained true -o artifacts/ProductionFlow
      - name: Include operating instructions
        shell: pwsh
        run: |
          Copy-Item docs/DESKTOP.md artifacts/ProductionFlow/KULLANIM.md
          Copy-Item LICENSE artifacts/ProductionFlow/LICENSE
      - uses: actions/upload-artifact@v4
        with:
          name: ProductionFlow-Desktop-win-x64
          path: artifacts/ProductionFlow/
          if-no-files-found: error
